<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005BFF"/>
      <stop offset="100%" stop-color="#00D2A8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#005BFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#005BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#00D2A8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00D2A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid dots -->
  <g fill="#ffffff" fill-opacity="0.04">
    <circle cx="60"  cy="60"  r="1.5"/><circle cx="180" cy="60"  r="1.5"/><circle cx="300" cy="60"  r="1.5"/>
    <circle cx="420" cy="60"  r="1.5"/><circle cx="540" cy="60"  r="1.5"/><circle cx="660" cy="60"  r="1.5"/>
    <circle cx="780" cy="60"  r="1.5"/><circle cx="900" cy="60"  r="1.5"/><circle cx="1020" cy="60" r="1.5"/>
    <circle cx="1140" cy="60" r="1.5"/>
    <circle cx="60"  cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/><circle cx="300" cy="180" r="1.5"/>
    <circle cx="420" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/><circle cx="660" cy="180" r="1.5"/>
    <circle cx="780" cy="180" r="1.5"/><circle cx="900" cy="180" r="1.5"/><circle cx="1020" cy="180" r="1.5"/>
    <circle cx="1140" cy="180" r="1.5"/>
    <circle cx="60"  cy="300" r="1.5"/><circle cx="180" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/>
    <circle cx="420" cy="300" r="1.5"/><circle cx="540" cy="300" r="1.5"/><circle cx="660" cy="300" r="1.5"/>
    <circle cx="780" cy="300" r="1.5"/><circle cx="900" cy="300" r="1.5"/><circle cx="1020" cy="300" r="1.5"/>
    <circle cx="1140" cy="300" r="1.5"/>
    <circle cx="60"  cy="420" r="1.5"/><circle cx="180" cy="420" r="1.5"/><circle cx="300" cy="420" r="1.5"/>
    <circle cx="420" cy="420" r="1.5"/><circle cx="540" cy="420" r="1.5"/><circle cx="660" cy="420" r="1.5"/>
    <circle cx="780" cy="420" r="1.5"/><circle cx="900" cy="420" r="1.5"/><circle cx="1020" cy="420" r="1.5"/>
    <circle cx="1140" cy="420" r="1.5"/>
    <circle cx="60"  cy="540" r="1.5"/><circle cx="180" cy="540" r="1.5"/><circle cx="300" cy="540" r="1.5"/>
    <circle cx="420" cy="540" r="1.5"/><circle cx="540" cy="540" r="1.5"/><circle cx="660" cy="540" r="1.5"/>
    <circle cx="780" cy="540" r="1.5"/><circle cx="900" cy="540" r="1.5"/><circle cx="1020" cy="540" r="1.5"/>
    <circle cx="1140" cy="540" r="1.5"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#g1)"/>

  <!--
    Logo × 4.5, centré : x_offset=308, y_offset=221
    Mark center → (407, 316)
    Outer half 81 : top(407,235) right(488,316) bottom(407,397) left(326,316)
    Inner half 45 : top(407,275) right(452,316) bottom(407,356) left(362,316)
    GEK    x=533 y=320  fs=113
    Sep    x1=533 x2=880 y=342
    INNOV  x=533 y=392  fs=45
    Tagline centré sur wordmark : x=(533+880)/2=706
  -->

  <!-- Mark : anneau diamant evenodd -->
  <path d="M407,235 L488,316 L407,397 L326,316 Z  M407,275 L452,316 L407,356 L362,316 Z"
        fill="url(#g1)" fill-rule="evenodd"/>
  <circle cx="407" cy="316" r="14" fill="url(#g1)"/>
  <circle cx="407" cy="235" r="9"  fill="#005BFF"/>
  <circle cx="488" cy="316" r="9"  fill="#00D2A8"/>

  <!-- GEK — blanc -->
  <text x="533" y="320"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="113" font-weight="800" fill="#FFFFFF" letter-spacing="9">GEK</text>

  <!-- Séparateur -->
  <line x1="533" y1="342" x2="880" y2="342"
        stroke="#00D2A8" stroke-width="5" stroke-opacity="0.6"/>

  <!-- INNOVATECH -->
  <text x="533" y="392"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="45" font-weight="500" fill="#00D2A8" letter-spacing="7">INNOVATECH</text>

  <!-- Tagline — centrée sur le wordmark, remontée juste sous INNOVATECH -->
  <text x="706" y="444"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-weight="300" font-size="17" fill="#ffffff"
        text-anchor="middle" fill-opacity="0.4" letter-spacing="3">AGENCE WEB · DESIGN · PERFORMANCE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005BFF"/>
      <stop offset="100%" stop-color="#00D2A8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0D0D0D"/>
  <!-- Outer diamond (solid gradient) -->
  <polygon points="16,3 29,16 16,29 3,16" fill="url(#fg)"/>
  <!-- Inner cutout (reveals background = ring effect) -->
  <polygon points="16,10 23,16 16,22 9,16" fill="#0D0D0D"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="url(#fg)"/>
</svg>

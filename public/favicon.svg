<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF5A45"/>
    </linearGradient>
  </defs>
  <!-- Fond carré arrondi, bleu marine -->
  <rect width="32" height="32" rx="7" fill="#1D467B"/>
  <!-- Diamant extérieur (dégradé blanc vers rouge) -->
  <polygon points="16,3 29,16 16,29 3,16" fill="url(#fg)"/>
  <!-- Découpe intérieure (laisse voir le fond : effet d'anneau) -->
  <polygon points="16,10 23,16 16,22 9,16" fill="#1D467B"/>
  <!-- Point central -->
  <circle cx="16" cy="16" r="2.5" fill="#FF5A45"/>
</svg>
